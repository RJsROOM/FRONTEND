<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <section class="allElems">
            <div class="todo elem" id="0">
                <img src="https://plus.unsplash.com/premium_photo-1683133569392-f85efe0620ef?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8M2QlMjBhbmltYXRpb25zfGVufDB8fDB8fHww" alt="">
                <h2>Todo</h2>
            </div>
            <div class="daily elem" id="1">
                <img src="https://images.unsplash.com/photo-1649326995808-53a45888fde3?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8M2QlMjBhbmltYXRpb25zfGVufDB8fDB8fHww" alt="">
                <h2>Daily planner</h2>
            </div>
            <div class="moti elem" id="2">
                <img src="https://media.istockphoto.com/id/2172779166/photo/cute-blue-robot-celebrate-birthday-3d-rendering.webp?a=1&b=1&s=612x612&w=0&k=20&c=3CVOBydXNQ3KN8S2Odb9C3CKxRCUJWU2iz4PK-lkV6U=" alt="">
                <h2>Motivation</h2>
            </div>
            <div class="pomo elem" id="3">
                <img src="https://plus.unsplash.com/premium_photo-1683141182084-2e4997f3ec5b?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8M2QlMjBhbmltYXRpb25zfGVufDB8fDB8fHww" alt="">
                <h2>Pomodoro</h2>
            </div>
            <div class="goals elem" id="4">
                <img src="https://images.unsplash.com/photo-1663851360815-784f3ba447f2?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTV8fDNkJTIwaWxsdXN0cmF0aW9uc3xlbnwwfHwwfHx8MA%3D%3D" alt="">
                <h2>Daily goals</h2>
            </div>
        </section>

        <section class="fullElem todo-fullpage">
            <button class="back" id="0" title="back">
                Close
            </button>
            <h2>Your Personalised Task List</h2>
            <div class="todo-container">
                <div class="addTask"></div>
                <div class="allTask"></div>
            </div>
        </section>
        <section class="fullElem dailyplanner-fullpage">
            <button class="back" id="1" title="back">
                Close
            </button>
            <h1>daily planner</h1>
        </section>
        <section class="fullElem motivation-fullpage">
            <button class="back" id="2" title="back">
                Close
            </button>
            <h1>motivation</h1>
        </section>
        <section class="fullElem pomo-fullpage">
            <button class="back" id="3" title="back">
                Close
            </button>
            <h1>pomodoro timer</h1>
        </section>
        <section class="fullElem goals-fullpage">
            <button class="back" id="4" title="back">
                Close
            </button>
            <h1>daily goals</h1>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
